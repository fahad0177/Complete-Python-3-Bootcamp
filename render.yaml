services:
  - type: web
    name: expense-tracker
    runtime: python
    plan: free
    rootDir: expense-tracker
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 300 --workers 1 --threads 4
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: APP_PASSWORD
        sync: false
      # After deploying, open the app and tap "Connect Google Drive", then add
      # the GOOGLE_REFRESH_TOKEN env var it shows you (one time).
